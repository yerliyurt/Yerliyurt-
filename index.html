<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Yerliyurt Marin</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Yerliyurt Marin">
<meta name="theme-color" content="#10243a">

<link rel="apple-touch-icon" href="logo.png.PNG">
<link rel="icon" type="image/png" href="logo.png.PNG">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 15px;
  font-family: Arial, sans-serif;
  background: #eef2f6;
  color: #172b42;
}

.container {
  max-width: 650px;
  margin: auto;
}

.logo {
  display: block;
  width: 250px;
  max-width: 90%;
  margin: 15px auto;
}

h1, h2 {
  text-align: center;
}

h1 {
  font-size: 24px;
}

.tabs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin: 20px 0;
}

button {
  width: 100%;
  padding: 14px;
  background: #10243a;
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 15px;
  cursor: pointer;
}

.tabs button.active {
  background: #1679a5;
}

.section {
  display: none;
}

.section.active {
  display: block;
}

.card {
  background: white;
  padding: 20px;
  border-radius: 16px;
  margin-bottom: 20px;
  box-shadow: 0 3px 12px #00000012;
}

label {
  display: block;
  font-weight: bold;
  margin-top: 15px;
  margin-bottom: 6px;
}

input, textarea, select {
  width: 100%;
  padding: 13px;
  border: 1px solid #ccd3da;
  border-radius: 10px;
  font-size: 16px;
}

textarea {
  min-height: 110px;
}

.full {
  margin-top: 16px;
}

.message {
  margin-top: 15px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  line-height: 1.5;
}

.record {
  background: #f7f9fc;
  padding: 15px;
  border: 1px solid #dce3eb;
  border-radius: 12px;
  margin-top: 12px;
  line-height: 1.8;
  overflow-wrap: anywhere;
}

.record strong {
  font-size: 18px;
}
</style>
</head>

<body>

<div class="container">

<img src="logo.png.PNG"
     alt="Yerliyurt Marin"
     class="logo">

<h1>Servis ve Sipariş Takip Sistemi</h1>

<div class="tabs">

<button type="button"
        data-tab="servis"
        onclick="sekmeAc('servis')">
🚤 Servis Kaydı
</button>

<button type="button"
        data-tab="gecmisServis"
        onclick="sekmeAc('gecmisServis')">
🔧 Geçmiş Servis Kayıtları
</button>

<button type="button"
        data-tab="siparis"
        onclick="sekmeAc('siparis')">
📋 Sipariş Formları
</button>

<button type="button"
        data-tab="gecmisSiparis"
        onclick="sekmeAc('gecmisSiparis')">
📂 Geçmiş Siparişler
</button>

</div>


<!-- YENİ SERVİS KAYDI -->

<section id="servis" class="section active">
<div class="card">

<h2>🚤 Yeni Servis Kaydı</h2>

<form id="servisForm">

<label>Müşteri Ad Soyad</label>
<input id="customer_name" required>

<label>Telefon</label>
<input id="phone" type="tel">

<label>Tekne</label>
<input id="boat">

<label>Motor</label>
<input id="motor">

<label>Yapılan İşlem</label>
<textarea id="service_details"></textarea>

<label>Ücret (₺)</label>
<input id="amount" type="number" min="0" step="0.01">

<label>Ödeme Durumu</label>
<select id="paid">
<option value="false">Ödenmedi</option>
<option value="true">Ödendi</option>
</select>

<label>Servis Tarihi</label>
<input id="service_date" type="date" required>

<button class="full" type="submit">
💾 Servis Kaydını Kaydet
</button>

</form>

<div id="servisMesaj" class="message"></div>

</div>
</section>


<!-- GEÇMİŞ SERVİS KAYITLARI -->

<section id="gecmisServis" class="section">
<div class="card">

<h2>🔧 Geçmiş Servis Kayıtları</h2>

<label>Müşteri Ara</label>
<input id="servisArama"
       placeholder="Müşteri adı veya soyadı">

<button class="full" type="button"
        onclick="servisAra()">
🔎 Servis Kaydı Ara
</button>

<button class="full" type="button"
        onclick="tumServisleriGetir()">
📋 Tüm Servis Kayıtlarını Göster
</button>

<div id="servisSonuc" class="message"></div>

</div>
</section>


<!-- SİPARİŞ FORMLARI -->

<section id="siparis" class="section">
<div class="card">

<h2>📋 Yeni Sipariş Formu</h2>

<form id="siparisForm">

<label>Tarih</label>
<input id="siparisTarih" type="date" required>

<label>Ad Soyad</label>
<input id="siparisMusteri" required>

<label>Telefon</label>
<input id="siparisTelefon" type="tel">

<label>Model</label>
<input id="siparisModel">

<label>Notlar</label>
<textarea id="siparisNotlar"></textarea>

<button class="full" type="submit">
💾 Siparişi Kaydet
</button>

</form>

<div id="siparisMesaj" class="message"></div>

</div>
</section>


<!-- GEÇMİŞ SİPARİŞLER -->

<section id="gecmisSiparis" class="section">
<div class="card">

<h2>📂 Geçmiş Siparişler</h2>

<label>Müşteri Ara</label>
<input id="siparisArama"
       placeholder="Müşteri adı veya soyadı">

<button class="full" type="button"
        onclick="siparisAra()">
🔎 Sipariş Ara
</button>

<button class="full" type="button"
        onclick="tumSiparisleriGetir()">
📋 Tüm Siparişleri Göster
</button>

<div id="siparisSonuc" class="message"></div>

</div>
</section>

</div>


<script>

/* SUPABASE BİLGİLERİ */

const SUPABASE_URL =
  "https://grkixellsuhlsryrkaff.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_203KVZ7fXhED0wTpBdqPhw_Y_fsM7kX";


/* YARDIMCI FONKSİYONLAR */

function alan(id) {
  return document.getElementById(id);
}

function deger(id) {
  return alan(id).value.trim();
}

function mesajYaz(id, mesaj) {
  alan(id).textContent = mesaj;
}

function bugun() {
  const d = new Date();

  const yil = d.getFullYear();
  const ay = String(d.getMonth() + 1).padStart(2, "0");
  const gun = String(d.getDate()).padStart(2, "0");

  return `${yil}-${ay}-${gun}`;
}

function metin(value) {
  return String(value ?? "-");
}

function satir(baslik, value) {
  const div = document.createElement("div");
  div.textContent = baslik + ": " + metin(value);
  return div;
}


/* SUPABASE BAĞLANTISI */

async function apiIstek(yol, ayarlar = {}) {

  if (!SUPABASE_KEY.startsWith("sb_publishable_")) {
    throw new Error(
      "Supabase Publishable Key eksik veya yanlış."
    );
  }

  const response = await fetch(
    SUPABASE_URL + "/rest/v1/" + yol,
    {
      ...ayarlar,
      headers: {
        apikey: SUPABASE_KEY,
        ...ayarlar.headers
      }
    }
  );

  if (!response.ok) {
    throw new Error(await response.text());
  }

  if (response.status === 204) {
    return null;
  }

  return response.json();
}


/* SEKME DEĞİŞTİRME */

function sekmeAc(sekme) {

  document.querySelectorAll(".section")
    .forEach(bolum => {
      bolum.classList.remove("active");
    });

  document.querySelectorAll(".tabs button")
    .forEach(buton => {
      buton.classList.remove("active");
    });

  alan(sekme).classList.add("active");

  const buton = document.querySelector(
    '[data-tab="' + sekme + '"]'
  );

  if (buton) {
    buton.classList.add("active");
  }

  window.scrollTo(0, 0);
}


/* SERVİS KAYDETME */

alan("servisForm").addEventListener(
  "submit",
  async function(e) {

    e.preventDefault();

    const kayit = {
      customer_name: deger("customer_name"),
      phone: deger("phone"),
      boat: deger("boat"),
      motor: deger("motor"),
      service_details: deger("service_details"),
      amount: deger("amount") === ""
        ? null
        : Number(deger("amount")),
      paid: deger("paid") === "true",
      service_date: deger("service_date")
    };

    mesajYaz("servisMesaj", "Kaydediliyor...");

    try {

      await apiIstek("service_records", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Prefer: "return=minimal"
        },
        body: JSON.stringify(kayit)
      });

      mesajYaz(
        "servisMesaj",
        "✅ Servis kaydı başarıyla kaydedildi."
      );

      alan("servisForm").reset();
      alan("service_date").value = bugun();

    } catch (error) {

      mesajYaz(
        "servisMesaj",
        "❌ Hata: " + error.message
      );

    }
  }
);


/* GEÇMİŞ SERVİS KAYITLARI */

async function servisleriGetir(arama = "") {

  mesajYaz("servisSonuc", "Kayıtlar yükleniyor...");

  try {

    let sorgu =
      "service_records?select=*" +
      "&order=service_date.desc";

    if (arama) {
      sorgu +=
        "&customer_name=ilike." +
        encodeURIComponent("*" + arama + "*");
    }

    const kayitlar = await apiIstek(sorgu);

    kayitlariGoster(
      "servisSonuc",
      kayitlar,
      "servis"
    );

  } catch (error) {

    mesajYaz(
      "servisSonuc",
      "❌ Hata: " + error.message
    );

  }
}

function servisAra() {
  servisleriGetir(deger("servisArama"));
}

function tumServisleriGetir() {
  servisleriGetir();
}


/* SİPARİŞ KAYDETME */

alan("siparisForm").addEventListener(
  "submit",
  async function(e) {

    e.preventDefault();

    const siparis = {
      order_date: deger("siparisTarih"),
      customer_name: deger("siparisMusteri"),
      phone: deger("siparisTelefon"),
      model: deger("siparisModel"),
      notes: deger("siparisNotlar")
    };

    mesajYaz("siparisMesaj", "Kaydediliyor...");

    try {

      await apiIstek("orders", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Prefer: "return=minimal"
        },
        body: JSON.stringify(siparis)
      });

      mesajYaz(
        "siparisMesaj",
        "✅ Sipariş başarıyla kaydedildi."
      );

      alan("siparisForm").reset();
      alan("siparisTarih").value = bugun();

    } catch (error) {

      mesajYaz(
        "siparisMesaj",
        "❌ Hata: " + error.message
      );

    }
  }
);


/* GEÇMİŞ SİPARİŞLER */

async function siparisleriGetir(arama = "") {

  mesajYaz("siparisSonuc", "Siparişler yükleniyor...");

  try {

    let sorgu =
      "orders?select=*" +
      "&order=order_date.desc";

    if (arama) {
      sorgu +=
        "&customer_name=ilike." +
        encodeURIComponent("*" + arama + "*");
    }

    const kayitlar = await apiIstek(sorgu);

    kayitlariGoster(
      "siparisSonuc",
      kayitlar,
      "siparis"
    );

  } catch (error) {

    mesajYaz(
      "siparisSonuc",
      "❌ Hata: " + error.message
    );

  }
}

function siparisAra() {
  siparisleriGetir(deger("siparisArama"));
}

function tumSiparisleriGetir() {
  siparisleriGetir();
}


/* KAYITLARI EKRANDA GÖSTERME */

function kayitlariGoster(hedef, kayitlar, tur) {

  const kutu = alan(hedef);
  kutu.replaceChildren();

  if (!kayitlar || kayitlar.length === 0) {
    kutu.textContent = "Kayıt bulunamadı.";
    return;
  }

  kayitlar.forEach(k => {

    const kart = document.createElement("div");
    kart.className = "record";

    const baslik = document.createElement("strong");
    baslik.textContent =
      "👤 " + metin(k.customer_name);

    kart.appendChild(baslik);

    if (tur === "servis") {

      kart.appendChild(satir("📞 Telefon", k.phone));
      kart.appendChild(satir("🚤 Tekne", k.boat));
      kart.appendChild(satir("⚙️ Motor", k.motor));

      kart.appendChild(
        satir("🔧 Yapılan İşlem", k.service_details)
      );

      kart.appendChild(
        satir("💰 Ücret", (k.amount ?? 0) + " ₺")
      );

      kart.appendChild(
        satir(
          "💳 Ödeme",
          k.paid ? "Ödendi" : "Ödenmedi"
        )
      );

      kart.appendChild(
        satir("📅 Tarih", k.service_date)
      );

    } else {

      kart.appendChild(
        satir("📅 Tarih", k.order_date)
      );

      kart.appendChild(
        satir("📞 Telefon", k.phone)
      );

      kart.appendChild(
        satir("🚤 Model", k.model)
      );

      kart.appendChild(
        satir("📝 Notlar", k.notes)
      );

    }

    kutu.appendChild(kart);

  });
}


/* BAŞLANGIÇ */

alan("service_date").value = bugun();
alan("siparisTarih").value = bugun();

sekmeAc("servis");

</script>

</body>
</html>
