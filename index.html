<!DOCTYPE html>

<html lang="tr">

<head>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Yerliyurt Servis">
<meta name="theme-color" content="#111111">
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Yerliyurt Servis</title>

  <style>

    * { box-sizing: border-box; }

    body {

      margin: 0;

      font-family: Arial, sans-serif;

      background: #f4f4f4;

      color: #222;

    }

    header {

      background: #111;

      color: white;

      padding: 25px 20px;

      text-align: center;

    }

    .container {

      max-width: 650px;

      margin: 25px auto;

      padding: 20px;

    }

    .card {

      background: white;

      padding: 25px;

      border-radius: 18px;

      box-shadow: 0 4px 18px rgba(0,0,0,.08);

    }

    h2 { margin-top: 0; }

    label {

      display: block;

      margin-top: 15px;

      margin-bottom: 6px;

      font-weight: bold;

    }

    input, textarea, select {

      width: 100%;

      padding: 14px;

      border: 1px solid #ccc;

      border-radius: 10px;

      font-size: 16px;

    }

    textarea {

      min-height: 110px;

    }

    button {

      width: 100%;

      margin-top: 22px;

      padding: 16px;

      border: 0;

      border-radius: 10px;

      background: #111;

      color: white;

      font-size: 18px;

      cursor: pointer;

    }

    #durum {

      text-align: center;

      margin-top: 15px;

      font-weight: bold;

    }

  </style>

</head>

<body>

<header>

  <h1>Yerliyurt</h1>

  <p>Servis Müşteri Kayıt Sistemi</p>

</header>

<div class="container">

  <div class="card">

    <h2>Yeni Servis Kaydı</h2>

    <form id="servisForm">

      <label>Müşteri Adı</label>

      <input id="customer_name" required>

      <label>Telefon</label>

      <input id="phone" type="tel">

      <label>Tekne</label>

      <input id="boat">

      <label>Motor</label>

      <input id="motor">

      <label>Yapılan İşlem</label>

      <textarea id="service_details"></textarea>

      <label>Ücret (₺)</label>

      <input id="amount" type="number" step="0.01">

      <label>Ödeme Durumu</label>

      <select id="paid">

        <option value="false">Ödenmedi</option>

        <option value="true">Ödendi</option>

      </select>

      <label>Servis Tarihi</label>

      <input id="service_date" type="date">

      <button type="submit">Servis Kaydını Kaydet</button>

    </form>
<hr style="margin:30px 0;">

<h2>Müşteri Ara</h2>

<input
  type="text"
  id="musteriAra"
  placeholder="Müşteri adını yazın"
  style="width:100%; padding:12px; margin-bottom:10px;"
>

<button type="button" onclick="musteriAra()">
  Müşteri Ara
</button>

<div id="aramaSonuclari" style="margin-top:20px;"></div>
    <div id="durum"></div>

  </div>

</div>

<script>

const SUPABASE_URL = "https://grkixellsuhlsryrkaff.supabase.co/rest/v1/";

const SUPABASE_KEY = "sb_publishable_203KVZ7fXhED0wTpBdqPhw_Y_fsM7kX";

document.getElementById("servisForm").addEventListener("submit", async function(e) {

  e.preventDefault();

  const durum = document.getElementById("durum");

  durum.textContent = "Kaydediliyor...";

  const kayit = {

    customer_name: document.getElementById("customer_name").value,

    phone: document.getElementById("phone").value,

    boat: document.getElementById("boat").value,

    motor: document.getElementById("motor").value,

    service_details: document.getElementById("service_details").value,

    amount: document.getElementById("amount").value || null,

    paid: document.getElementById("paid").value === "true",

    service_date: document.getElementById("service_date").value || null

  };

  try {

    const response = await fetch(

      SUPABASE_URL + "/rest/v1/service_records",

      {

        method: "POST",

        headers: {

          "apikey": SUPABASE_KEY,

          "Authorization": "Bearer " + SUPABASE_KEY,

          "Content-Type": "application/json",

          "Prefer": "return=minimal"

        },

        body: JSON.stringify(kayit)

      }

    );

    if (!response.ok) {

      throw new Error(await response.text());

    }

    durum.textContent = "✅ Servis kaydı başarıyla kaydedildi.";

    document.getElementById("servisForm").reset();

  }  catch (error) {
  durum.textContent = "❌ Hata: " + error.message;
  console.error(error);
}

  }

});
async function musteriAra() {
  const arama = document.getElementById("musteriAra").value.trim();
  const sonuc = document.getElementById("aramaSonuclari");

  if (!arama) {
    sonuc.innerHTML = "Müşteri adı yazın.";
    return;
  }

  sonuc.innerHTML = "Aranıyor...";

  try {
    const response = await fetch(
      SUPABASE_URL +
      "/rest/v1/service_records?customer_name=ilike.*" +
      encodeURIComponent(arama) +
      "*&order=service_date.desc",
      {
        headers: {
          "apikey": SUPABASE_KEY
        }
      }
    );

    if (!response.ok) {
      throw new Error(await response.text());
    }

    const kayitlar = await response.json();

    if (kayitlar.length === 0) {
      sonuc.innerHTML = "Kayıt bulunamadı.";
      return;
    }

    sonuc.innerHTML = kayitlar.map(k => `
      <div style="
        padding:15px;
        margin:10px 0;
        border:1px solid #ddd;
        border-radius:12px;
      ">
        <strong>${k.customer_name}</strong><br><br>

        📞 ${k.phone || "-"}<br>
        🚤 Tekne: ${k.boat || "-"}<br>
        ⚙️ Motor: ${k.motor || "-"}<br>
        🔧 İşlem: ${k.service_details || "-"}<br>
        💰 Ücret: ${k.amount || 0} ₺<br>
        💳 Ödeme: ${k.paid ? "Ödendi" : "Ödenmedi"}<br>
        📅 Servis Tarihi: ${k.service_date || "-"}
      </div>
    `).join("");

  } catch (error) {
    sonuc.innerHTML = "❌ Kayıtlar getirilemedi.";
    console.error(error);
  }
}
</script>

</body>

</html>
